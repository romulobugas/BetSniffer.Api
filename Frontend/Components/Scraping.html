<div class="scraping-container">
    <h2>Atualizar Jogos</h2>
    <div class="date-container">
        <div>
            <label for="startDate">Data Inicial:</label>
            <input type="date" id="startDate" name="startDate" />
        </div>
        <div>
            <label for="endDate">Data Final:</label>
            <input type="date" id="endDate" name="endDate" />
        </div>
    </div>

    <div id="siteCheckboxList"></div>

    <div class="ia-option" style="margin: 10px 0; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="useIa" style="width: auto;">
        <label for="useIa" style="font-weight: bold; color: #ffeb3b;">Usar Scraping Visual (IA)</label>
    </div>

    <button id="sendRequest">Enviar</button>
    <button id="toggleAll">Marcar/Desmarcar Todos</button>
</div>
