<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/styles/Styles.css">
    <title>BetSniffer - Ferramentas</title>
</head>
<body>
    <div class="container">
        <h1>BetSniffer <span id="version"></span> - Ferramentas</h1>
        <div class="tabs">
            <button class="tab-button active" data-tab="updateGames">Atualizar Jogos</button>
            <button class="tab-button" data-tab="monitor">Monitor</button>
            <button class="tab-button" data-tab="scraper">Raspagem</button>
        </div>
        <div class="tab-content">
            <div id="updateGames" class="tab-pane active">
                <div class="date-container">
                    <div>
                        <label for="startDate">Data Inicial:</label>
                        <input type="date" id="startDate" name="startDate" />
                    </div>
                    <div>
                        <label for="endDate">Data Final:</label>
                        <input type="date" id="endDate" name="endDate" />
                    </div>
                </div>
                <div id="siteCheckboxList"></div>
                <button id="toggleAll">Marcar/Desmarcar Todos</button>
                <button id="sendRequest">Atualizar Jogos</button>
            </div>
            <div id="monitor" class="tab-pane">
                <h2>Monitoramento</h2>
                <p>Links em processamento: <span id="activeLinksCount">0</span></p>
                <div id="monitorContent"></div>
            </div>
            <div id="scraper" class="tab-pane active">
                <h2>Adicionar Links para Raspagem</h2>
                <div id="linkContainer"></div>
                <div class="button-group">
                    <button id="addLink">Novo Link</button>
                    <button id="clearLinks">Limpar Links</button>
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <button id="sendLinks">Enviar Links</button>
                </div>
            </div>

        </div>
    </div>

    <script src="../Scripts/TabControl.js"></script>
    <script src="../Scripts/updateGames.js"></script>
    <script src="../Scripts/monitor.js"></script>
    <script src="../Scripts/scraper.js"></script>
    <script src="../Scripts/main.js"></script>
</body>
</html>
